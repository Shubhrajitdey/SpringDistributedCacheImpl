version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: demo_mysql
    restart: always
    environment:
      MYSQL_DATABASE: root
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  
  redis-cache:
    image: redis:alpine
    container_name: demo_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: